<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CUIOM Staff Portal</title>
<style>
:root{--navy:#241075;--orange:#f58220;--green:#0a9652;--red:#e51b23;--bg:#f4f6fb;--line:#e5e7ef}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#111}
button{border:0;border-radius:14px;padding:13px 16px;background:var(--navy);color:#fff;font-weight:800;font-size:16px;cursor:pointer}
button.green{background:var(--green)}button.red{background:var(--red)}button.light{background:#fff;color:var(--navy);border:1px solid var(--line)}
input,select,textarea{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:16px}
textarea{min-height:120px}label{font-size:13px;color:#475467;font-weight:800}.hide{display:none!important}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 8px 25px #00000010}
.login{max-width:450px;width:100%}.logo{width:125px;height:125px;object-fit:contain}
h1,h2,h3{color:var(--navy)}.brand{text-align:center;font-weight:900;color:var(--navy);font-size:21px}.sub{text-align:center;font-weight:900;color:var(--red);margin-bottom:16px}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:10px;display:flex;align-items:center;gap:10px}
.top img{width:48px;height:48px;object-fit:contain}.spacer{flex:1}.tabs{display:flex;gap:8px;overflow:auto;padding:10px;background:#fff;border-bottom:1px solid var(--line)}
.tabs button{white-space:nowrap;background:#eef0f6;color:#111}.tabs button.active{background:var(--navy);color:#fff}
.wrap{max-width:900px;margin:auto;padding:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}
.row{display:flex;gap:8px;flex-wrap:wrap}.muted{color:#667085}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:12px 18px;border-radius:999px;display:none;z-index:20;max-width:92%}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="login" class="center">
<form id="loginForm" class="card login">
<center><img class="logo" src="logo.png" alt="CUIOM logo"></center>
<div class="brand">CHRIST UNIVERSAL IMPACT OUTREACH MINISTRIES</div>
<div class="sub">STAFF PORTAL</div>
<label>Staff Username</label>
<input id="username" autocomplete="username">
<br><br>
<label>Password</label>
<input id="password" type="password" autocomplete="current-password">
<br><br>
<button type="submit" class="green" style="width:100%">STAFF LOGIN</button>
<br><br>
<a href="index.html" style="display:block;text-align:center;color:#241075;font-weight:800">Admin Login</a>
</form>
</div>

<div id="app" class="hide">
<div class="top">
<img src="logo.png" alt="CUIOM logo">
<b>CUIOM<br>Staff Portal</b>
<span id="who"></span><div class="spacer"></div>
<button class="light" id="logout">Logout</button>
</div>
<div id="tabs" class="tabs"></div>
<div class="wrap"><div id="main"></div></div>
</div>
<div id="toast" class="toast"></div>

<script>
(function(){
'use strict';
var API=window.CUIOM_API_BASE||window.location.origin;
var currentUser=null;

function $(id){return document.getElementById(id)}
function toast(msg){var t=$('toast');t.textContent=msg;t.style.display='block';setTimeout(function(){t.style.display='none'},2800)}
function token(){try{return localStorage.getItem('cuiom_cloud_token')||''}catch(e){return ''}}
function headers(){var h={'Content-Type':'application/json'},t=token();if(t)h.Authorization='Bearer '+t;return h}
function stateGet(k,d){try{var x=localStorage.getItem(k);return x?JSON.parse(x):d}catch(e){return d}}
function applyState(s){if(!s)return;Object.keys(s).forEach(function(k){try{localStorage.setItem(k,JSON.stringify(s[k]))}catch(e){}})}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function today(){return new Date().toISOString().slice(0,10)}
function now(){return new Date().toLocaleTimeString()}
function people(){return stateGet('cuiom_people',[])}
function attendance(){return stateGet('cuiom_att',[])}
function reports(){return stateGet('cuiom_daily_reports',[])}
function emergencyReports(){return stateGet('cuiom_emergency_reports',[])}
function makeId(prefix){return prefix+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,9)}
function pendingGet(){return stateGet('cuiom_pending_sync',[])}
function pendingAdd(type,item){var q=pendingGet();if(type==='report')q=q.filter(function(x){return x.type!=='report'});q.push({type:type,item:item,queuedAt:new Date().toISOString()});localStorage.setItem('cuiom_pending_sync',JSON.stringify(q))}
function onlineNow(){return navigator.onLine!==false}
async function syncPending(){if(!onlineNow()||!token())return;var q=pendingGet();if(!q.length)return;var keep=[];for(var i=0;i<q.length;i++){var job=q[i];try{var endpoint=job.type==='attendance'?API+'/api/attendance/sync':API+'/api/snapshot/'+(job.type==='emergency'?'cuiom_emergency_reports':'cuiom_daily_reports');var payload=job.type==='attendance'?{value:[job.item]}:{value:job.type==='emergency'?emergencyReports():reports()};var r=await fetch(endpoint,{method:'POST',headers:headers(),body:JSON.stringify(payload)});if(!r.ok)throw new Error('sync failed');var x=await r.json();if(x.state)applyState(x.state)}catch(e){keep.push(job)}}localStorage.setItem('cuiom_pending_sync',JSON.stringify(keep));if(!keep.length)toast('Offline records synced to Admin.')}
function updateConnectionNote(){var el=document.getElementById('connectionNote');if(el)el.textContent=onlineNow()?'Online — cloud connection available':'Offline — records will be saved on this device and synced when internet returns.'}

async function login(u,p){
 try{
  var r=await fetch(API+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
  var x=await r.json();
  if(!r.ok)throw new Error(x.error||'Login failed');
  if(!x.user||String(x.user.role||'').toLowerCase()!=='staff')throw new Error('This portal is for Staff accounts only.');
  localStorage.setItem('cuiom_cloud_token',x.token);
  applyState(x.state);
  currentUser=x.user;
  localStorage.setItem('cuiom_staff_portal_user',JSON.stringify(currentUser));
  showApp();
 }catch(e){toast(e.message||'Unable to log in')}
}

function staffRecord(){
 return people().find(function(p){
  return p&&String(p.role||'').toLowerCase()==='staff'&&
   (String(p.uid||'')===String(currentUser.uid||'')||String(p.uid||'')===String(currentUser.username||''));
 });
}

function makeTabs(){
 $('tabs').innerHTML=
  '<button data-page="clock">Staff Clock In/Out</button>'+
  '<button data-page="daily">Weekly Activity Report</button>'+
  '<button data-page="emergency">Emergency Report</button>';
 $('tabs').insertAdjacentHTML('afterend','<div id="connectionNote" class="muted" style="padding:8px 14px;background:#fff"></div>');updateConnectionNote();
 Array.prototype.forEach.call($('tabs').querySelectorAll('button'),function(b){
  b.onclick=function(){nav(this.getAttribute('data-page'))}
 });
}

function nav(page){
 Array.prototype.forEach.call($('tabs').querySelectorAll('button'),function(b){
  b.classList.toggle('active',b.getAttribute('data-page')===page)
 });
 if(page==='clock')clockPage();
 if(page==='daily')dailyPage();
 if(page==='emergency')emergencyPage();
}

function clockPage(){
 var p=staffRecord();
 if(!p){$('main').innerHTML='<div class="card"><h2>Staff record not found</h2><p>Please contact Admin.</p></div>';return}
 var rows=attendance().filter(function(r){
  return String(r.uid)===String(p.uid)&&(r.session==='Clock In'||r.session==='Clock Out')
 });
 var todayRows=rows.filter(function(r){return r.date===today()});
 var last=todayRows.length?todayRows[todayRows.length-1]:null;

 $('main').innerHTML=
 '<div class="card"><h2>Staff Clock In/Out</h2>'+
 '<h3>'+esc(p.name)+'</h3>'+
 '<p><b>Staff ID:</b> '+esc(p.uid)+'</p>'+
 '<h1>'+now()+'</h1>'+
 '<div class="row"><button class="green" id="cin">Clock In</button><button class="red" id="cout">Clock Out</button></div>'+
 '<p class="muted">You can clock in and out as required.</p></div><br>'+
 '<div class="card"><h3>My Recent Clock Records</h3>'+
 '<div>'+rows.slice(-20).reverse().map(function(r){
  return '<p><b>'+esc(r.date)+'</b> — '+esc(r.time)+' — '+esc(r.session)+'</p>'
 }).join('')+'</div></div>';

 $('cin').onclick=function(){
  var a=attendance();
  a.push({date:today(),time:now(),uid:p.uid,name:p.name,role:'Staff',
   classDept:p.classDept||'',session:'Clock In',status:'Present',scanner:'Self'});
  saveAttendance(a,'Clock In');
 };
 $('cout').onclick=function(){
  var a=attendance(),day=a.filter(function(r){return String(r.uid)===String(p.uid)&&r.date===today()}),last=day.length?day[day.length-1]:null;
  if(!last||last.session!=='Clock In')return toast('Clock In first before Clock Out.');
  a.push({date:today(),time:now(),uid:p.uid,name:p.name,role:'Staff',
   classDept:p.classDept||'',session:'Clock Out',status:'Present',scanner:'Self'});
  saveAttendance(a,'Clock Out');
 };
}

async function saveAttendance(a,msg){
 var event=a[a.length-1];if(!event._eventId)event._eventId=makeId('cuiom-att');
 applyState({cuiom_att:a});
 if(!onlineNow()){pendingAdd('attendance',event);toast(msg+' saved offline; it will sync when internet returns.');clockPage();return}
 try{var r=await fetch(API+'/api/attendance/sync',{method:'POST',headers:headers(),body:JSON.stringify({value:[event]})});var x=await r.json();if(!r.ok)throw new Error(x.error||'Cloud save failed');applyState(x.state||{cuiom_att:a});toast(msg+' saved and synced');clockPage()}catch(e){pendingAdd('attendance',event);toast(msg+' saved on this device; sync will retry when internet returns.');clockPage()}
}

function dailyPage(){
 var p=staffRecord();
 if(!p){$('main').innerHTML='<div class="card"><p>Staff record not found.</p></div>';return}
 var start=weekKey(today()),end=weekEnd(start),tm=now();
 $('main').innerHTML='<div class="card"><h2>Weekly Activity Report</h2><p class="muted">Submit one summary of your work for the selected week. If you are offline, it will be saved on this device and queued for syncing.</p><div class="grid">'+
 '<div><label>Name</label><input id="arName" readonly value="'+esc(p.name)+'"></div>'+ 
 '<div><label>Job Role</label><input id="arRole" readonly value="'+esc(p.classDept||'')+'"></div>'+ 
 '<div><label>Week Starting (Monday)</label><input id="arDate" type="date" value="'+start+'"></div>'+ 
 '<div><label>Week Ending (Sunday)</label><input id="arWeekEnd" readonly value="'+end+'"></div>'+ 
 '<div><label>Supervisor</label><input id="arSup" readonly value="'+esc(p.supervisor||'')+'"></div>'+ 
 '<div><label>Mode of Supervision</label><select id="arMode"><option>Onsite</option><option>Remote</option><option>Mixed</option></select></div>'+ 
 '<div class="full"><label>What were your major challenges during this week?</label><textarea id="arChallenges"></textarea></div>'+ 
 '<div class="full"><label>What were your major achievements during this week?</label><textarea id="arAchievements"></textarea></div>'+ 
 '<div class="full"><label>Weekly summary of incidents and activities done according to your job role:</label><textarea id="arActivities"></textarea></div>'+ 
 '<div><label>Are there unfinished tasks to carry forward next week?</label><select id="arUnfinished"><option>No</option><option>Yes</option></select></div>'+ 
 '<div id="details" style="display:none"><label>If yes, give details</label><textarea id="arDetails"></textarea></div>'+ 
 '<div class="full"><button class="green" id="submit">Submit Weekly Report</button></div></div></div>';
 $('arDate').onchange=function(){var d=weekKey(this.value);this.value=d;$('arWeekEnd').value=weekEnd(d)};
 $('arUnfinished').onchange=function(){$('details').style.display=this.value==='Yes'?'block':'none'};
 $('submit').onclick=submitReport;
}
async function submitReport(){
 var p=staffRecord();var challenges=$('arChallenges').value.trim(),achievements=$('arAchievements').value.trim(),activities=$('arActivities').value.trim();
 var unfinished=$('arUnfinished').value,details=$('arDetails').value.trim(),start=weekKey($('arDate').value),end=weekEnd(start);
 if(!challenges||!achievements||!activities)return toast('Please complete the three main weekly report sections.');
 if(unfinished==='Yes'&&!details)return toast('Please give details of the unfinished task.');
 var a=reports();var existing=a.find(function(r){return String(r.uid)===String(p.uid)&&String(r.week||weekKey(r.date))===start});
 var r={id:existing?existing.id:makeId('WAR'),uid:p.uid,name:p.name,date:start,time:now(),week:start,weekEnd:end,month:start.slice(0,7),jobRole:p.classDept||'',supervisor:p.supervisor||'',mode:$('arMode').value,challenges:challenges,achievements:achievements,activities:activities,unfinished:unfinished,unfinishedDetails:details,reportType:'weekly'};
 if(existing){a=a.map(function(x){return x===existing?r:x})}else a.push(r);
 applyState({cuiom_daily_reports:a});
 $('submit').disabled=true;$('submit').textContent='Saving Weekly Report...';
 if(!onlineNow()){pendingAdd('report',r);toast('Weekly report saved offline. It will sync when internet returns.');$('submit').disabled=false;$('submit').textContent='Submit Weekly Report';return nav('daily')}
 try{var resp=await fetch(API+'/api/snapshot/cuiom_daily_reports',{method:'POST',headers:headers(),body:JSON.stringify({value:a})});if(!resp.ok)throw new Error('Cloud save failed');var x=await resp.json();applyState(x.state||{cuiom_daily_reports:a});toast('Weekly report submitted to Admin');nav('daily')}
 catch(e){pendingAdd('report',r);toast('Weekly report saved on this device; it will sync when internet returns.');}
 finally{$('submit').disabled=false;$('submit').textContent='Submit Weekly Report'}
}
var emergencyRecorder=null, emergencyChunks=[], emergencyAudioData='', emergencyAttachments=[];
function readEmergencyFiles(files){return Promise.all(Array.prototype.slice.call(files||[]).map(function(file){return new Promise(function(resolve,reject){if(file.size>8*1024*1024){reject(new Error(file.name+' is larger than 8 MB. Please choose a smaller file.'));return}var reader=new FileReader();reader.onload=function(){resolve({name:file.name,type:file.type||'application/octet-stream',size:file.size,data:String(reader.result||'')})};reader.onerror=function(){reject(new Error('Could not read '+file.name))};reader.readAsDataURL(file)})}))}
function emergencyPage(){
 var p=staffRecord();if(!p){$('main').innerHTML='<div class="card"><p>Staff record not found.</p></div>';return}
 var d=new Date(),date=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),time=d.toLocaleTimeString();emergencyAudioData='';emergencyAttachments=[];
 $('main').innerHTML='<div class="card" style="border:2px solid #b91c1c"><h2 style="color:#b91c1c">Emergency Report</h2><p>Use this form to alert Admin about an urgent incident. If offline, the report will be saved on this device and queued to sync.</p><div class="grid"><div><label>Name of Reporter</label><input id="erName" readonly value="'+esc(p.name||currentUser.name||'')+'"></div><div><label>Staff ID</label><input id="erUid" readonly value="'+esc(p.uid||currentUser.uid||'')+'"></div><div><label>Date of Report</label><input id="erDate" readonly value="'+date+'"></div><div><label>Time of Report</label><input id="erTime" readonly value="'+time+'"></div><div class="full"><label>Emergency Message</label><textarea id="erMessage" rows="5" placeholder="Describe the emergency or incident clearly..."></textarea></div><div class="full"><label>Voice recording (optional)</label><div class="row"><button type="button" id="erRecord">Start Voice Recording</button><button type="button" id="erStop" disabled>Stop Recording</button></div><p id="erVoiceStatus" class="muted">You can type a message, record your voice, and attach evidence.</p><audio id="erAudioPreview" controls style="display:none;width:100%"></audio></div><div class="full"><label>Upload supporting files (optional)</label><input id="erFiles" type="file" multiple accept="image/*,video/*,application/pdf,.doc,.docx,.txt"><p class="muted">Choose photos, videos, PDFs or documents. Maximum 8 MB per file; keep total attachments small for reliable submission.</p></div><div class="full"><label>Take a picture (optional)</label><input id="erPhoto" type="file" accept="image/*" capture="environment"><p class="muted">On supported phones, this opens the camera.</p></div><div class="full"><label>Record a video (optional)</label><input id="erVideo" type="file" accept="video/*" capture="environment"><p class="muted">On supported phones, this opens the camera for video. Camera capture depends on the device/browser.</p></div><div class="full"><p id="erFilesStatus" class="muted">No supporting files selected.</p></div><div class="full"><button class="red" id="erSubmit">Submit Emergency Report to Admin</button></div></div></div>';
 $('erRecord').onclick=async function(){try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder)throw new Error('Voice recording is not supported in this browser. Please type the emergency message.');var stream=await navigator.mediaDevices.getUserMedia({audio:true});emergencyChunks=[];emergencyRecorder=new MediaRecorder(stream);emergencyRecorder.ondataavailable=function(e){if(e.data&&e.data.size)emergencyChunks.push(e.data)};emergencyRecorder.onstop=function(){var blob=new Blob(emergencyChunks,{type:emergencyRecorder.mimeType||'audio/webm'});var reader=new FileReader();reader.onloadend=function(){emergencyAudioData=String(reader.result||'');$('erAudioPreview').src=emergencyAudioData;$('erAudioPreview').style.display='block';$('erVoiceStatus').textContent='Voice recording ready to submit.'};reader.readAsDataURL(blob);stream.getTracks().forEach(function(t){t.stop()})};emergencyRecorder.start();$('erRecord').disabled=true;$('erStop').disabled=false;$('erVoiceStatus').textContent='Recording…';}catch(e){toast(e.message||'Unable to start voice recording')}};
 $('erStop').onclick=function(){if(emergencyRecorder&&emergencyRecorder.state!=='inactive'){emergencyRecorder.stop();$('erRecord').disabled=false;$('erStop').disabled=true}};
 function filesChanged(){var all=[];['erFiles','erPhoto','erVideo'].forEach(function(id){var el=$(id);if(el&&el.files)Array.prototype.forEach.call(el.files,function(f){if(!all.some(function(x){return x.name===f.name&&x.size===f.size}))all.push(f)})});$('erFilesStatus').textContent=all.length?all.length+' file(s) selected: '+all.map(function(f){return f.name}).join(', '):'No supporting files selected.'}
 ['erFiles','erPhoto','erVideo'].forEach(function(id){$(id).onchange=filesChanged});
 $('erSubmit').onclick=submitEmergencyReport;
}
async function submitEmergencyReport(){var p=staffRecord(),message=$('erMessage').value.trim();var chosen=[];['erFiles','erPhoto','erVideo'].forEach(function(id){var el=$(id);if(el&&el.files)Array.prototype.forEach.call(el.files,function(f){if(!chosen.some(function(x){return x.name===f.name&&x.size===f.size}))chosen.push(f)})});if(!message&&!emergencyAudioData&&!chosen.length)return toast('Please type a message, record your voice, or attach a file/photo/video.');$('erSubmit').disabled=true;$('erSubmit').textContent='Preparing report…';try{var attachments=await readEmergencyFiles(chosen);var total=attachments.reduce(function(n,f){return n+f.size},0);if(total>10*1024*1024)throw new Error('Attachments total more than 10 MB. Please remove some files.');var a=emergencyReports();var r={id:makeId('EMR'),uid:p.uid,name:p.name||currentUser.name||'',date:$('erDate').value,time:$('erTime').value,message:message,audioData:emergencyAudioData,attachments:attachments,createdAt:new Date().toISOString(),status:'New',reportType:'emergency'};a.push(r);applyState({cuiom_emergency_reports:a});$('erSubmit').textContent='Submitting…';if(!onlineNow()){pendingAdd('emergency',r);toast('Emergency report saved offline and queued to sync.');return}var resp=await fetch(API+'/api/snapshot/cuiom_emergency_reports',{method:'POST',headers:headers(),body:JSON.stringify({value:a})});if(!resp.ok)throw new Error('Cloud save failed');var x=await resp.json();applyState(x.state||{cuiom_emergency_reports:a});toast('Emergency report submitted to Admin.');emergencyAudioData='';emergencyPage()}catch(e){if(typeof r!=='undefined'&&r&&(!onlineNow()||String(e.message||'').indexOf('Cloud save failed')>=0||String(e.message||'').indexOf('fetch')>=0))pendingAdd('emergency',r);toast((e.message||'Report could not be submitted')+'. Please try a smaller file or submit when connected.')}finally{var b=$('erSubmit');if(b){b.disabled=false;b.textContent='Submit Emergency Report to Admin'}}}

function weekKey(d){var x=new Date(d+'T00:00:00');if(isNaN(x.getTime()))x=new Date();var day=x.getDay()||7;x.setDate(x.getDate()-day+1);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
function weekEnd(d){var x=new Date(d+'T00:00:00');x.setDate(x.getDate()+6);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}

function showApp(){
 $('login').classList.add('hide');$('app').classList.remove('hide');
 $('who').textContent=currentUser.name+' (Staff)';
 makeTabs();nav('clock');
}
function logout(){
 currentUser=null;
 try{localStorage.removeItem('cuiom_cloud_token');localStorage.removeItem('cuiom_staff_portal_user')}catch(e){}
 $('app').classList.add('hide');$('login').classList.remove('hide');
}
async function restore(){var saved=stateGet('cuiom_staff_portal_user',null),t=token();if(!saved||!t)return;currentUser=saved;try{var r=await fetch(API+'/api/state',{headers:headers()});if(!r.ok)throw new Error();applyState(await r.json());showApp();syncPending()}catch(e){if(staffRecord()){showApp();toast('Offline mode: cached records are available.');}else{currentUser=null;}}}
window.addEventListener('online',function(){updateConnectionNote();syncPending()});window.addEventListener('offline',updateConnectionNote);
$('loginForm').onsubmit=function(e){e.preventDefault();login($('username').value.trim().toLowerCase(),$('password').value)}
$('logout').onclick=logout;
restore();
})();
</script>
</body>
</html>
